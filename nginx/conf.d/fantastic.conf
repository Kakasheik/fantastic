# =====================================================================
# Fantastic — Reverse proxy com TLS (Let's Encrypt).
# =====================================================================

# Redireciona HTTP → HTTPS. ACME challenge é servido em /.well-known.
server {
    listen 80;
    server_name fantastic.com.br www.fantastic.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS principal — Frontend Next.js + API.
server {
    listen 443 ssl http2;
    server_name fantastic.com.br www.fantastic.com.br;

    ssl_certificate     /etc/letsencrypt/live/fantastic.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fantastic.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # SECURITY: bloqueia hotlinking + frames externos.
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # API
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://app-backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth — limit estrito
    location /api/v1/auth/login    { limit_req zone=auth_limit burst=2 nodelay; proxy_pass http://app-backend:4000; }
    location /api/v1/auth/register { limit_req zone=auth_limit burst=2 nodelay; proxy_pass http://app-backend:4000; }

    # WebSocket (Socket.IO)
    location /chat/ {
        proxy_pass http://app-backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 86400;
    }

    # Frontend Next.js
    location / {
        proxy_pass http://app-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
