# Fantastic — Ambiente de desenvolvimento local.
# Para produção, use a variante prod (terraform/k8s) ou stack hospedada.
#
# SECURITY:
#  - Senhas e secrets via .env (nunca commitar).
#  - Postgres expõe 5432 apenas para a rede interna em prod.
#  - Nginx termina TLS via Let's Encrypt (certbot) em prod.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-fantastic}
      POSTGRES_USER:     ${POSTGRES_USER:-fantastic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fantastic}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fantastic}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fantastic}:${POSTGRES_PASSWORD:-fantastic}@db:5432/${POSTGRES_DB:-fantastic}?schema=public
      DIRECT_URL:   postgresql://${POSTGRES_USER:-fantastic}:${POSTGRES_PASSWORD:-fantastic}@db:5432/${POSTGRES_DB:-fantastic}?schema=public
      REDIS_URL:    redis://redis:6379
      PORT:         "4000"
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "4000:4000"

  app-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_WS_URL:  ws://localhost:4000/chat
      PORT: "3000"
    depends_on:
      - app-backend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app-frontend
      - app-backend

  certbot:
    image: certbot/certbot
    restart: "no"
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --quiet;
               sleep 12h & wait $${!};
             done"

volumes:
  postgres_data:
  redis_data:
